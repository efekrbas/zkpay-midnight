<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZKPay | Confidential Payroll</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          var errBox = document.createElement('div');
          errBox.style.cssText = 'position:fixed;top:20px;left:20px;right:20px;background:#2d1515;border:1px solid #ff4d4f;color:#fff;padding:20px;border-radius:12px;font-family:monospace;z-index:999999;white-space:pre-wrap;';
          errBox.innerHTML = '<h3 style="color:#ff4d4f;margin-bottom:10px;">JavaScript Error:</h3>' + (e.message || e.error) + '\n\nSource: ' + e.filename + ':' + e.lineno;
          document.body.appendChild(errBox);
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
